name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    name: docs (markdownlint + enlaces)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes markdownlint-cli2@0.17.2 "**/*.md" "#node_modules" "#odd" "#.atl"
      - run: node scripts/check-links.mjs
  mockups-a11y:
    name: mockups (axe + toques 44px)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Playwright y axe
        run: |
          npm i --no-save --no-audit --no-fund playwright@1 @axe-core/playwright@4
          npx playwright install --with-deps chromium
      - run: node scripts/a11y-mockups.mjs design/mockups
